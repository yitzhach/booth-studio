name: CI

# Booth Studio's checks. Nothing deploys from here: `main` is production
# through Cloudflare's Git integration (CLAUDE.md), and staging through
# Art-Talk-Back's "Deploy staging" workflow.
#
# Four jobs. `core`: the node suites, the build, the vendored SDK against the
# platform, the two-device run against a local studio-api from
# yitzhach/Art-Talk-Back (its default branch, or its branch of the same name:
# Art-Talk-Back D-056), and the end-to-end checks. The two-device step points
# the browser at a dead proxy: it must pass with no internet, the way a show
# floor often is; loopback bypasses it. `lint`: the linter and the type check.
# `views`: the view suites, in four shards on four runners at once — run one
# after another they took 40 of the 49 minutes a pull request waited.
# `booth`: green only when the other three are, and the name branch
# protection requires, so a red shard still blocks a merge.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request makes the run for the older one
# pointless: cancel it. Every other run (a push to main, a manual run) is a
# group of its own, so none of them is ever cancelled or dropped from the
# queue: a group keeps only one waiting run, even when it cancels nothing.
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # A change that spans both repos sits on a branch of the same name in each
      # (Art-Talk-Back D-056): test against that platform branch, else its default branch.
      - name: Pick the platform branch
        id: platform
        run: |
          ref="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if git ls-remote --exit-code --heads https://github.com/yitzhach/Art-Talk-Back "$ref" >/dev/null 2>&1; then
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
          else
            echo "ref=" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          repository: yitzhach/Art-Talk-Back
          ref: ${{ steps.platform.outputs.ref }}
          path: .studio-platform
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: .studio-platform/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Node suites
        run: npm test
      - run: npm run build
      # vite.config.js puts three.js in a chunk of its own, so a deploy doesn't
      # re-send it to every returning browser; nothing else would notice if a
      # tool upgrade quietly folded it back into the app's script.
      # A second build (its time stamp differs, so the app's half does) must
      # give three.js's chunk the same name, or a deploy re-sends it.
      - name: The first load is split (three.js on its own, same name build to build)
        run: |
          check='
            const fs = require("fs");
            const files = fs.readdirSync("dist/assets");
            const three = files.find((f) => /^three-[\w-]+\.js$/.test(f));
            const index = files.find((f) => /^index-[\w-]+\.js$/.test(f));
            const html = fs.readFileSync("dist/index.html", "utf8");
            const preloaded = [...html.matchAll(/<link\b[^>]*>/g)].map((m) => m[0])
              .filter((tag) => /\brel="modulepreload"/.test(tag)).map((tag) => /\bhref="([^"]+)"/.exec(tag)?.[1] || "");
            const kb = (f) => Math.round(fs.statSync(`dist/assets/${f}`).size / 1024);
            if (!three || !index) throw new Error(`expected index-*.js and three-*.js in dist/assets, found: ${files.join(", ")}`);
            if (!preloaded.some((href) => href.endsWith(`/${three}`))) throw new Error(`index.html does not preload ${three}: ${preloaded.join(", ")}`);
            if (kb(three) < 400) throw new Error(`three-*.js is only ${kb(three)} KB: is three.js still in it?`);
            console.log(`index ${kb(index)} KB, three ${kb(three)} KB`);
            fs.writeFileSync("/tmp/three-chunk", three);
          '
          node -e "$check"
          first=$(cat /tmp/three-chunk)
          npm run -s build >/dev/null
          node -e "$check"
          test "$first" = "$(cat /tmp/three-chunk)" || { echo "::error::three.js's chunk changed name between two builds: $first, then $(cat /tmp/three-chunk)"; exit 1; }
      - name: Studio platform (wrangler + studio-api)
        working-directory: .studio-platform
        run: pnpm install --frozen-lockfile
      - name: src/vendor/studio-sdk.js matches the platform's SDK
        working-directory: .studio-platform
        run: pnpm --filter @studio/sdk bundle:esm --check --out "$GITHUB_WORKSPACE/src/vendor/studio-sdk.js"
      - name: The platform's src/vendor/booth-scene.js is this app's scene build (Art-Talk-Back D-070)
        run: |
          npm run -s bundle:scene
          f=.studio-platform/workers/studio-api/src/vendor/booth-scene.js
          if [ ! -f "$f" ]; then echo "::notice::the platform doesn't run this app's scene code yet"; exit 0; fi
          cmp dist-scene/booth-scene.js "$f" || {
            echo "::error::Art-Talk-Back's workers/studio-api/src/vendor/booth-scene.js differs from npm run bundle:scene: copy dist-scene/booth-scene.js there on the branch of the same name"; exit 1; }
      # The browser suites are written against the Chromium the development
      # sandbox has (build 1194, Chromium 141, full browser: BOOTH_TEST_CHROMIUM in
      # CLAUDE.md), with WebGL on swiftshader. The pinned Playwright's own default,
      # a newer headless shell, stops drawing frames under the suites' single-process
      # flags, so CI fetches that same build and points the suites at it.
      - name: Chromium build 1194 (the sandbox's)
        run: |
          npx -y playwright@1.56.1 install --with-deps chromium
          echo "BOOTH_TEST_CHROMIUM=$HOME/.cache/ms-playwright/chromium-1194/chrome-linux/chrome" >> "$GITHUB_ENV"
      - name: Two devices, offline, against studio-api (the app's compatibility date)
        env: { HTTPS_PROXY: "http://127.0.0.1:9", HTTP_PROXY: "http://127.0.0.1:9", NO_PROXY: "127.0.0.1,localhost", STUDIO_PLATFORM: .studio-platform }
        run: node tests/two-devices.mjs
      - name: Two devices again, at the platform's pinned compatibility date (its D-025)
        env: { HTTPS_PROXY: "http://127.0.0.1:9", HTTP_PROXY: "http://127.0.0.1:9", NO_PROXY: "127.0.0.1,localhost", STUDIO_PLATFORM: .studio-platform, BOOTH_COMPAT_DATE: "2026-08-15" }
        run: node tests/two-devices.mjs
      - name: End-to-end checks
        run: npm run test:browser
      # The built app, through its service worker, with the network cut.
      - name: Opens offline (public/sw.js, the built app)
        run: npm run test:offline

  # ESLint's recommended rules, and TypeScript reading the JSDoc: of the
  # modules studio-api runs, against a Worker's globals (tsconfig.json), and
  # of the page's other modules, against a browser's (tsconfig.app.json).
  # A job of its own, so a lint error is reported in a minute and never stops
  # the suites from reporting theirs.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        if: ${{ !cancelled() }}
        run: npm run typecheck

  views:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # Every shard runs to the end, so one CI run reports every failure.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The same Chromium as `core`, for the same reason (see there).
      - name: Chromium build 1194 (the sandbox's)
        run: |
          npx -y playwright@1.56.1 install --with-deps chromium
          echo "BOOTH_TEST_CHROMIUM=$HOME/.cache/ms-playwright/chromium-1194/chrome-linux/chrome" >> "$GITHUB_ENV"
      # The suites of `npm run test:view`, read from package.json; this shard
      # takes every fourth, so a suite added there is picked up with no change
      # here. Each runs to the end, and the step names every one that failed.
      - name: View suites, shard ${{ matrix.shard }} of 4
        run: |
          suites=$(node -p "require('./package.json').scripts['test:view'].match(/tests\/view-[\w-]+\.mjs/g).filter((_, i) => i % 4 === ${{ matrix.shard }}).join(' ')")
          failed=""
          for s in $suites; do
            echo "::group::$s"
            node "$s" || failed="$failed $s"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::View suites failed:$failed"; exit 1; fi

  # Runs when a needed job failed or was skipped, so that is a red check; not
  # when the whole run was cancelled for a newer push, which is no verdict.
  booth:
    needs: [core, lint, views]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        run: |
          echo "core: ${{ needs.core.result }} · lint: ${{ needs.lint.result }} · views: ${{ needs.views.result }}"
          test "${{ needs.core.result }}" = success
          test "${{ needs.lint.result }}" = success
          test "${{ needs.views.result }}" = success
